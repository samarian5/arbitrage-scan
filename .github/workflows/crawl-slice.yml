name: crawl-slice

# The worker. Any number of repos can run this at once: they all claim from the
# same queue function, which hands out disjoint slices (FOR UPDATE SKIP LOCKED)
# and refuses work past the daily page budget. That is the load balancer — it
# lives in Postgres, not in a timer, so a dead runner costs one slice and a
# burst of runners cannot over-crawl.
on:
  workflow_call:
    inputs:
      slot:
        type: string
        default: "w1"
      slices:
        type: number
        default: 10
    secrets:
      SUPABASE_URL:
        required: false
      SUPABASE_SERVICE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      slot:
        description: "worker slot name (keeps concurrency groups disjoint)"
        default: "w1"
      slices:
        description: "max keyword slices this job may take"
        default: "10"
      keyword:
        description: "run this one keyword instead of claiming from the queue"
        default: ""
  schedule:
    - cron: "7 */2 * * *"

concurrency:
  group: crawl-${{ inputs.slot || 'w1' }}
  cancel-in-progress: false

# Deliberately no `permissions:` block. A reusable workflow that requests write
# scope makes every cross-repo call fail at validation with `startup_failure`
# and zero jobs — the caller cannot grant it either, because a `uses:` job's
# token is fixed at call time. Diagnostics therefore go to the artifact and to
# the step summary, not to a commit on the branch.

jobs:
  slice:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt

      # A cold Chrome profile gets SplashUI'd and never recovers in-run; a warm
      # one is trusted. Cache it per slot — never shared across slots, because
      # one fingerprint arriving from several IPs at once is what gets it flagged.
      - name: Restore eBay profile
        uses: actions/cache@v4
        with:
          path: .ebay-profile
          key: ebay-profile-${{ inputs.slot || 'w1' }}-${{ github.run_id }}
          restore-keys: |
            ebay-profile-${{ inputs.slot || 'w1' }}-

      - name: Browser for the eBay lane
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null 2>&1 || true
          echo "BROWSER_BIN=$(command -v google-chrome || command -v chromium || echo '')" >> "$GITHUB_ENV"

      # Cheap gate: parsers and matcher are pure functions over fixtures, so a
      # markup regression fails here in 3 s instead of burning a crawl budget.
      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Crawl
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CI: "true"
          PYTHONUNBUFFERED: "1"
          SHARD: ${{ inputs.slot || 'w1' }}
          KW: ${{ inputs.keyword || '' }}
        run: |
          set -o pipefail
          timeout 3480 xvfb-run -a python -m crawler.run \
            --slot "${SHARD}" --max-slices ${{ inputs.slices || 10 }} \
            ${KW:+--keyword "$KW"} 2>&1 | tee crawl.log

      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("out/meta.json")
          if not p.exists():
              print("no slices claimed this run")
              raise SystemExit
          for m in json.loads(p.read_text()):
              print(f"- **{m.get('keyword')}** — ebay {m.get('ebay_seen',0)}, "
                    f"amazon {m.get('amazon_seen',0)}, matches {m.get('matches',0)}, "
                    f"{m.get('stopped_reason')}, {m.get('duration_s')}s")
          PY

      - name: Upload run bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slice-${{ github.run_id }}-${{ inputs.slot || 'w1' }}
          path: |
            out/
            runs/
          retention-days: 3
          if-no-files-found: ignore

      # Keep the failure reason readable without an authenticated log download:
      # the proxy truncates logs, artifacts are binary, a JSON file is text.
      - name: Persist run diagnostics
        if: always()
        run: |
          mkdir -p runs
          python - <<'PY' > runs/last.json || true
          import json, pathlib
          p = pathlib.Path("out/meta.json")
          print(json.dumps(json.loads(p.read_text()) if p.exists() else [], indent=1))
          PY
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import json, pathlib
          p = pathlib.Path("runs/last.json")
          rows = json.loads(p.read_text()) if p.exists() else []
          print("```json")
          print(json.dumps(rows, indent=1)[:4000])
          print("```")
          PY
